name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Validate the catalog
        run: earlywarn validate

      - name: Run tests
        run: pytest -q

      - name: Check the generated files are current
        run: |
          earlywarn export
          earlywarn page
          git diff --exit-code -- data/ \
            || (echo "::error::data/ is stale - run 'earlywarn export && earlywarn page' and commit the result" && exit 1)
